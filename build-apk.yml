name: Build MechanicTool APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MechanicTool_Android_Ver1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir project
          unzip -q MechanicTool_Android_Ver1.zip -d project

      - name: Build APK
        working-directory: project/MechanicTool
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp project/MechanicTool/app/build/outputs/apk/debug/app-debug.apk MechanicTool.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MechanicTool-APK
          path: MechanicTool.apk
